[workspace]
members = [
    "crates/cortex-kernels",
    "crates/cortex-ssm",
    "crates/cortex-hippocampus",
    "crates/cortex-sleep",
    "crates/cortex-runtime",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
# Numeric engine: debug tests need real speed (the MeZO acceptance
# test runs 240 forward evaluations). opt-level 2 keeps debug
# builds fast to compile while making tests ~3x faster.
opt-level = 2
